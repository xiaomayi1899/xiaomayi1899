      out.front = front.slice().sort(function (a, b) { return a - b; });
      out.back = back.slice().sort(function (a, b) { return a - b; });

    return out;
  }
  function rowsOf(g, arr) {
    var out = [];
    for (var i = 0; i < (arr || []).length; i++) { var r = normalizeRow(g, arr[i]); if (r) out.push(r); }
    out.sort(function (a, b) { return Number(b.issue) - Number(a.issue); });
    return out;
  }

  function initBaked() {

    try {

        ['ssq', 'dlt'].forEach(function (g) {
          var lr = rowsOf(g, o[g].rows);

  function invalidate() { app.cache = {}; }
  function memo(g, key, fn) {
    var sig = g + ':' + app.data[g].rows.length + ':' + (app.data[g].rows[0] ? app.data[g].rows[0].issue : '');

  async function refresh(silent) {
    var newer = [];
    for (var gi = 0; gi < 2; gi++) {
      var g = gi === 0 ? 'ssq' : 'dlt';
      try {
        var res = await fetch('data/' + g + '.json?_=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var j = await res.json();
        var fr = rowsOf(g, j.rows);
        if (fr.length) {
          var prev = app.data[g].rows[0] ? app.data[g].rows[0].issue : '';
          app.data[g] = { rows: C.mergeRows(app.data[g].rows, fr), updatedAt: j.updatedAt || '', src: '官方·GitHub同步' };
          if (Number(app.data[g].rows[0].issue) > Number(prev || 0)) newer.push((g === 'ssq' ? '双色球' : '大乐透') + ' ' + app.data[g].rows[0].issue);
        }
      } catch (e) { }
    }
    save(); invalidate(); render();
    tryTextdb();
    if (newer.length) toast('已同步最新开奖：' + newer.join('、') + '，复盘与下期推荐已自动重算');

  /* textdb 镜像兜底：只补充本地没有的新期号，已有期号以官方同步为准 */
  function tryTextdb() {
    var s = document.createElement('script');
    var done = false;
    var t = setTimeout(function () { finish(); }, 8000);
    function finish() {
      if (!done) { done = true; clearTimeout(t); }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    s.onload = function () {
      if (done) return;
      try {
        var L = window.CSQ_LIVE;
        if (!L || !L.games) throw new Error('empty');
        var ch = [];
        ['ssq', 'dlt'].forEach(function (g) {
          var have = {};
          for (var i = 0; i < app.data[g].rows.length; i++) have[String(app.data[g].rows[i].issue)] = 1;
          var norm = rowsOf(g, L.games[g] || []).filter(function (r) { return !have[r.issue]; });
          if (norm.length) {
            var prev = app.data[g].rows[0] ? app.data[g].rows[0].issue : '';
            app.data[g].rows = C.mergeRows(app.data[g].rows, norm);
            if (!app.data[g].updatedAt) app.data[g].updatedAt = L.fetchedAt || '';
            if (Number(app.data[g].rows[0].issue) > Number(prev || 0)) ch.push((g === 'ssq' ? '双色球' : '大乐透') + ' ' + app.data[g].rows[0].issue);
          }
        });
        if (ch.length) { save(); invalidate(); render(); toast('镜像频道已补充最新开奖：' + ch.join('、')); }
      } catch (e) { }
      finish();
    };
    s.onerror = function () { finish(); };
    s.src = 'https://textdb.dev/api/data/csq2-lottery-live-2026a1?_=' + Date.now();
    document.head.appendChild(s);
  }

  /* ---------------- 复盘（窗口可选）+ 统一量化聚合 ---------------- */
  function replayOf(g) {
    var eng = engOf(g);
    var rows = app.data[g].rows;
    return memo(g, 'replay|' + app.rw, function () { return eng.replay(rows, app.rw); });
  }

  /* Bonferroni 阈值：m 次比较、族错误率 5%，双侧 z 阈值（二分反解 normCdf） */
  function zFromP(pTwo, m) {
    var target = pTwo / (2 * (m || 22));
    var lo = 0, hi = 8;
    for (var i = 0; i < 50; i++) {
      var mid = (lo + hi) / 2;
      if (1 - M.normCdf(mid) > target) lo = mid; else hi = mid;
    }
    return Math.round(((lo + hi) / 2) * 100) / 100;
  }

  function aggStats(g, rp) {
    var isS = g === 'ssq';
    var pool = poolOf(g), K = kOf(g);
    var subPool = isS ? 16 : 12, subK = isS ? 1 : 2;
    var mB = M.hyperMean(pool, K, K), vB = M.hyperVar(pool, K, K);
    var n = rp.length;
    var sumHits = 0, subSum = 0, bordaMain = 0, bordaSub = 0;
    var hist = {};
    var fs = []; /* 与 rec.per 同序 */
    for (var i = 0; i < rp.length; i++) {
      var e = rp[i], act = e.actual;
      var hits = isS ? e.redHits : e.frontHits;
      sumHits += hits;
      hist[hits] = (hist[hits] || 0) + 1;
      var subHit = isS ? e.blueHit : (e.backHits > 0 ? 1 : 0);
      subSum += subHit;
      var bn = isS ? e.rec.bordaRed : e.rec.bordaFront;
      var bmain = isS ? act.red : act.front;
      for (var j = 0; j < bmain.length; j++) if (bn.indexOf(bmain[j]) >= 0) bordaMain++;
      var bsb = isS ? [e.rec.bordaBlue] : e.rec.bordaBack;
      var bactS = isS ? [act.blue] : act.back;
      for (var j0 = 0; j0 < bactS.length; j0++) if (bsb.indexOf(bactS[j0]) >= 0) bordaSub++;
      if (!fs.length) {
        for (var k = 0; k < e.rec.per.length; k++) fs.push({ id: e.rec.per[k].id, name: e.rec.per[k].name, hits: 0, sub: 0, bSum: 0, lSum: 0, bNull: 0, lNull: 0 });
      }
      var yM = [], p0v = K / pool;
      for (var nn = 1; nn <= pool; nn++) yM.push(bmain.indexOf(nn) >= 0 ? 1 : 0);
      var nullM = [];
      for (var nn2 = 1; nn2 <= pool; nn2++) nullM.push(p0v);
      var actS = isS ? [act.blue] : act.back;
      var yS = [], p0s = subK / subPool;
      for (var ns = 1; ns <= subPool; ns++) yS.push(actS.indexOf(ns) >= 0 ? 1 : 0);
      var nullS = [];
      for (var ns2 = 1; ns2 <= subPool; ns2++) nullS.push(p0s);
      for (k = 0; k < e.rec.per.length; k++) {
        var pf = e.rec.per[k];
        fs[k].hits += bmain.indexOf(pf.pick) >= 0 ? 1 : 0;
        var fsub = isS ? (pf.pickB === act.blue ? 1 : 0) : (act.back.indexOf(pf.pickB) >= 0 ? 1 : 0);
        fs[k].sub += fsub;
        var pR = [], pBq = [];
        for (nn = 1; nn <= pool; nn++) pR.push(pf.pRed[nn]);
        for (ns = 1; ns <= subPool; ns++) pBq.push(pf.pBlue[ns]);
        fs[k].bSum += M.brier(pR, yM);
        fs[k].lSum += M.logScore(pR, yM);
        fs[k].bNull += M.brier(nullM, yM);
        fs[k].lNull += M.logScore(nullM, yM);
      }
    }
    /* 后区概率 Brier/Log（后区逐期累加） */
    var subB = {}, subL = {}, subBNull = 0, subLNull = 0;
    for (i = 0; i < rp.length; i++) {
      var e2 = rp[i], act2 = e2.actual;
      var aS = isS ? [act2.blue] : act2.back;
      var yS2 = [], p0s2 = subK / subPool;
      for (var ns3 = 1; ns3 <= subPool; ns3++) yS2.push(aS.indexOf(ns3) >= 0 ? 1 : 0);
      var nl2 = [];
      for (var ns4 = 1; ns4 <= subPool; ns4++) nl2.push(p0s2);
      subBNull += M.brier(nl2, yS2);
      subLNull += M.logScore(nl2, yS2);
      for (var k2 = 0; k2 < e2.rec.per.length; k2++) {
        var pf2 = e2.rec.per[k2], arr = [];
        for (var ns5 = 1; ns5 <= subPool; ns5++) arr.push(pf2.pBlue[ns5]);
        subB[k2] = (subB[k2] || 0) + M.brier(arr, yS2);
        subL[k2] = (subL[k2] || 0) + M.logScore(arr, yS2);
      }
    }
    for (var k3 = 0; k3 < fs.length; k3++) {
      fs[k3].n = n;
      fs[k3].mean = fs[k3].hits / n;
      fs[k3].z = (fs[k3].hits - n * K / pool) / Math.sqrt(n * (K / pool) * (1 - K / pool));
      fs[k3].p = M.twoSideP(fs[k3].z);
      fs[k3].bss = 1 - fs[k3].bSum / fs[k3].bNull;
      fs[k3].lskill = (fs[k3].lSum - fs[k3].lNull) / n;
      fs[k3].subRate = fs[k3].sub / n;
      fs[k3].subCI = M.wilsonCI(fs[k3].sub, n);
      fs[k3].subBss = 1 - subB[k3] / subBNull;
      fs[k3].subLskill = (subL[k3] - subLNull) / n;
    }
    /* 自适应量化权重：对数得分技巧分 → James-Stein 式收缩 → softmax（防过拟合） */
    var KAPPA = 6, N0 = 40, ws = [], mx = -1e9;
    for (k3 = 0; k3 < fs.length; k3++) {
      var shr = n * fs[k3].lskill / (n + N0);
      var e4 = Math.exp(KAPPA * shr);
      ws.push(e4);
      if (e4 > mx) mx = e4;
    }
    var sw = 0;
    for (k3 = 0; k3 < ws.length; k3++) { ws[k3] = ws[k3] / mx; sw += ws[k3]; }
    for (k3 = 0; k3 < ws.length; k3++) ws[k3] = ws[k3] / sw;
    return {
      n: n, pool: pool, K: K, subPool: subPool, subK: subK,
      sumHits: sumHits, mean: sumHits / n, ci: [r3(sumHits / n - 1.96 * Math.sqrt(vB / n)), r3(sumHits / n + 1.96 * Math.sqrt(vB / n))],
      z: (sumHits - n * mB) / Math.sqrt(n * vB), p: M.twoSideP((sumHits - n * mB) / Math.sqrt(n * vB)),
      mB: mB, vB: vB,
      subSum: subSum, subRate: subSum / n, subCI: M.wilsonCI(subSum, n),
      subZ: (subSum - n * (subK / subPool)) / Math.sqrt(n * (subK / subPool) * (1 - subK / subPool)),
      subP0: subK / subPool,
      bordaMain: bordaMain, bordaZ: (bordaMain - n * mB) / Math.sqrt(n * vB),
      bordaSub: bordaSub,
      hist: hist, fs: fs, ws: ws
    };
  }

  function hitsBadge(v) {

  function replayView() {
    var g = app.sub;
    var eng = engOf(g);
    var rows = app.data[g].rows;
    var isS = g === 'ssq';
    var h = '<div class="subtabs"><button data-sub="ssq" class="' + (isS ? 'on' : '') + '">🔴 双色球</button><button data-sub="dlt" class="' + (!isS ? 'on' : '') + '">🔵 大乐透</button></div>';
    h += windowBar();
    if (rows.length < 61) { h += '<div class="card"><p class="note">数据不足 61 期，暂无法复盘。</p></div>'; return h; }
    var rp = replayOf(g);
    if (!rp.length) { h += '<div class="card"><p class="note">暂无可复盘期。</p></div>'; return h; }
    var A = aggStats(g, rp);
    var n = A.n;

    return h;
  }

  /* ---------------- 量化视图 ---------------- */
  function quantView() {
    var g = app.sub;
    var eng = engOf(g);
    var rows = app.data[g].rows;
    var isS = g === 'ssq';
    var name = isS ? '双色球' : '大乐透';
    var h = '<div class="subtabs"><button data-sub="ssq" class="' + (isS ? 'on' : '') + '">🔴 双色球</button><button data-sub="dlt" class="' + (!isS ? 'on' : '') + '">🔵 大乐透</button></div>';
    h += windowBar();
    if (rows.length < 61) { h += '<div class="card"><p class="note">数据不足 61 期，暂无法量化。</p></div>'; return h; }
    var rp = replayOf(g);
    if (!rp.length) { h += '<div class="card"><p class="note">暂无可复盘期。</p></div>'; return h; }
    var A = aggStats(g, rp);
    var n = A.n;
    var THR = zFromP(0.05, 110);

    /* 卡1 口径说明 */
    h += '<div class="card"><h2>📐 统一量化口径（同一把尺子量 55 式）</h2><div class="klist">';
    h += '<b>① 概率化</b>：每式的主驱动分数 → 组内 z 标准化 → log-linear 倾斜 p(n)=p₀·e<sup>0.35z</sup> → 校准 Σp=' + (isS ? '6（红）/1（蓝）' : '5（前）/2（后）') + '，p₀=' + r3(A.K / A.pool) + '（' + (isS ? '红球' : '前区') + '零模型）。倾斜对分数单调，不改变各式的选号结果，只把「选号」变成「可评分的预测分布」。<br>';
    h += '<b>② Brier 分数</b>：均方概率误差 Σ(p−y)²/N，越小越好；BSS = 1 − Brier式/Brier零模型，&gt;0 表示比瞎猜准。<br>';
    h += '<b>③ 对数得分</b>：平均对数似然，技巧分 = 式 − 零模型（nats/号·期），越大越好。<br>';
    h += '<b>④ 命中 z 检验</b>：对零模型的标准化偏离（合成注=超几何、单式票=二项），z=(实际−期望)/√方差；|z|≥' + THR + ' 才算通过 110 次比较的 Bonferroni 校正（防「挑好看的」）。<br>';
    h += '<b>⑤ 诚实预期</b>：彩票为独立随机事件，长期看所有式的 BSS≈0、z≈0——量化层的价值是<b>用数据证实这一点</b>，并让波动可解释。</div></div>';

    /* 卡2 公式评分榜 */
    var fs2 = A.fs.slice().sort(function (a, b) { return b.bss - a.bss || b.lskill - a.lskill; });
    h += '<div class="card"><h2>🎯 公式量化评分榜（近 ' + n + ' 期 walk-forward）</h2>';
    h += '<table><thead><tr><th>公式</th><th>Brier↓</th><th>BSS</th><th>log技巧</th><th>z<sub>单号</sub></th><th>' + (isS ? '蓝' : '后') + 'BSS</th></tr></thead><tbody>';
    for (var i = 0; i < fs2.length; i++) {
      var f = fs2[i];
      h += '<tr><td>' + esc(f.name) + '</td><td>' + (f.bSum / n).toFixed(4) + '</td><td>' + (f.bss >= 0 ? '+' : '') + (f.bss * 100).toFixed(2) + '%</td><td>' + (f.lskill >= 0 ? '+' : '') + (f.lskill * 1000).toFixed(1) + 'e-3</td><td>' + f.z.toFixed(2) + stars(f.z, THR) + '</td><td>' + (f.subBss >= 0 ? '+' : '') + (f.subBss * 100).toFixed(1) + '%</td></tr>';
    }
    h += '</tbody></table>';
    var sigCount = 0;
    for (i = 0; i < A.fs.length; i++) if (Math.abs(A.fs[i].z) >= THR) sigCount++;
    h += '<p class="note">零模型校准：若彩票确为随机，预期约 110×5%≈5.5 项出现 |z|≥1.96 的假阳性，而 |z|≥' + THR + ' 应基本不出现。当前 ' + sigCount + ' 项越过校正阈值' + (sigCount ? '——小样本下更可能是选择效应与多重比较，勿据此追热' : '，与随机性预期一致（诚实结论：公式不改变概率）') + '。BSS/log 技巧分为负属正常（倾斜偏离零模型但无真实信号）。</p></div>';

    /* 卡3 命中分布直方图 */
    h += '<div class="card"><h2>📊 票选注命中分布（观察 vs 零模型）</h2>';
    h += '<div class="meta2">近 ' + n + ' 期票选注' + (isS ? '红球' : '前区') + '命中枚数的分布；竖条=观察期数，灰条=超几何零模型预期期数。吻合即「公式没有额外信息」的直观证据。</div>';
    var maxC = 1;
    for (var hh = 0; hh <= A.K; hh++) {
      var oc = A.hist[hh] || 0;
      var ec = n * M.comb(A.K, hh) * M.comb(A.pool - A.K, A.K - hh) / M.comb(A.pool, A.K);
      if (oc > maxC) maxC = oc;
      if (ec > maxC) maxC = ec;
      h += '<div class="hrow"><span class="hlab">' + hh + '枚</span><span class="hbar obs"><i style="width:' + Math.round(oc / maxC * 100) + '%"></i></span><span class="hbar exp"><i style="width:' + Math.round(ec / maxC * 100) + '%"></i></span><span class="hval">' + oc + ' / ' + (Math.round(ec * 10) / 10) + '</span></div>';
    }
    h += '<div class="meta2">蓝条=观察 · 灰条=零模型期望（右列数字：观察/期望）</div></div>';

    /* 卡3.5 投票结构透明度：有效独立票数 + 式间相关（55²/Σ票² 与逐期 Pearson 平均） */
    var rec = memo(g, 'rec', function () { return eng.recommend(rows); });
    var st = memo(g, 'struct|' + n, function () {
      var V = 55, v2 = 0, bv2 = 0, nn;
      for (nn in rec.votes) v2 += rec.votes[nn] * rec.votes[nn];
      for (nn in rec.blueVotes) bv2 += rec.blueVotes[nn] * rec.blueVotes[nn];
      var F = rec.per.length, P = A.pool, pvecs = [];
      for (var i4 = 0; i4 < rp.length; i4++) {
        var pv = [];
        for (var k4 = 0; k4 < F; k4++) {
          var arr = [], n5;
          for (n5 = 1; n5 <= P; n5++) arr.push(rp[i4].rec.per[k4].pRed[n5]);
          pv.push(arr);
        }
        pvecs.push(pv);
      }
      function pearson(x, y) {
        var sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0, m = x.length, j;
        for (j = 0; j < m; j++) { sx += x[j]; sy += y[j]; sxx += x[j] * x[j]; syy += y[j] * y[j]; sxy += x[j] * y[j]; }
        var cov = sxy - sx * sy / m, vx = sxx - sx * sx / m, vy = syy - sy * sy / m;
        if (vx < 1e-9 || vy < 1e-9) return 1; /* 近常数向量（浮点尘埃级方差）视为完全同分布 */
        return cov / Math.sqrt(vx * vy);
      }
      var sumR = 0, cnt2 = 0, hi = [];
      for (var a2 = 0; a2 < F; a2++) for (var b3 = a2 + 1; b3 < F; b3++) {
        var rs = 0;
        for (var i5 = 0; i5 < rp.length; i5++) rs += pearson(pvecs[i5][a2], pvecs[i5][b3]);
        var rAvg = rs / rp.length;
        sumR += rAvg; cnt2++;
        if (rAvg >= 0.9) hi.push({ a: rec.per[a2].name, b: rec.per[b3].name, r: rAvg });
      }
      hi.sort(function (x, y) { return y.r - x.r; });
      return { effMain: V * V / Math.max(v2, 1), effSub: V * V / Math.max(bv2, 1), avg: sumR / cnt2, hi: hi, nPairs: cnt2 };
    });
    h += '<div class="card"><h2>🧾 投票结构透明度（有效独立票数与冗余式对）</h2><div class="klist">';
    h += '<b>有效独立票数</b> = 名义票数² ÷ Σ(单号票数²)：衡量 55 票的真实分散度。当前主区 ≈<b>' + st.effMain.toFixed(1) + '</b> 票，' + (isS ? '蓝球' : '后区') + ' ≈<b>' + st.effSub.toFixed(1) + '</b> 票（名义 55）。<br>';
    h += '<b>式间平均相关</b>：' + st.avg.toFixed(3) + '（' + st.nPairs + ' 对式两两 pRed 向量逐期 Pearson 取平均）；相关 ≥0.9 的冗余式对 <b>' + st.hi.length + '</b> 对';
    for (var i6 = 0; i6 < st.hi.length && i6 < 6; i6++) h += (i6 ? '、' : '：') + esc(st.hi[i6].a) + '×' + esc(st.hi[i6].b) + '（r=' + st.hi[i6].r.toFixed(3) + '）';
    if (st.hi.length > 6) h += ' 等共 ' + st.hi.length + ' 对';
    h += '。高相关 = 两式共享同一主驱动信号、票被重复计入；保留是为家族多样性，量化权重已做收缩平滑，不会重复放大。</div>';
    h += '<p class="note">彩种隔离声明：本页全部统计只在本彩种 55 式内部计算——双色球与大乐透两引擎零共享（号码池、窗口、公式、缓存均各自独立，无任何跨彩种数据或公式引用），严格分开、禁止混用。结果缓存只复用同键的确定性计算，不改变任何输出。</p></div>';

    /* 卡4 自适应权重 + 加权 Borda 注 */
    var wFront = eng.bordaTop(rec.per, A.pool, A.K, 'pRed', A.ws).sort(function (a, b) { return a - b; });
    var wSub = eng.bordaTop(rec.per, A.subPool, A.subK, 'pBlue', A.ws).sort(function (a, b) { return a - b; });
    h += '<div class="card"><h2>⚖️ 自适应量化权重 + 加权 Borda 注</h2>';
    h += '<div class="meta2">权重 w_i ∝ exp(6·收缩技巧分)，收缩 = n·skill/(n+40)：样本越小越被压平至均匀（正则化防过拟合）。权重只影响合成，不改各式选号。</div>';
    var fw = A.fs.map(function (f, idx) { return { name: f.name, w: A.ws[idx] }; }).sort(function (a, b) { return b.w - a.w; });
    for (i = 0; i < fw.length; i++) {
      h += '<div class="rankrow"><span>' + esc(fw[i].name) + '</span><span class="wnum">' + wbar(fw[i].w) + ' <b>' + pct1(fw[i].w) + '</b></span></div>';
    }
    h += '<div class="its" style="padding:8px 0 4px">';
    for (i = 0; i < wFront.length; i++) h += ballHTML(wFront[i], 'red');
    for (i = 0; i < wSub.length; i++) h += ballHTML(wSub[i], 'blue');
    h += '</div>';
    h += '<div class="meta2">加权 Borda 合成 · 第 ' + esc(C.nextIssue(rows[0].issue)) + ' 期参考（与基础票选并列对照，两者差异即「近期证据加权」的影响幅度）</div>';
    h += '<p class="note">诚实声明：随机数据下权重≈均匀 1/55≈1.8%，权重波动只是噪声的再分配，不构成预测优势。</p></div>';

    /* 卡5 概率透镜 */
    h += probLens(g);
    /* 卡6 资金纪律 */
    h += moneyCard(g);
    return h;
  }

  /* 资金纪律卡：凯利公式视角 */
  function moneyCard(g) {
    var isS = g === 'ssq';
    var h = '<div class="card"><h2>💰 资金纪律（凯利公式视角）</h2><div class="klist">';

  /* ---------------- 事件与启动 ---------------- */

  function toast(msg) {
    var t = el('toast');
    t.textContent = msg;
    t.className = '';
    if (toastT) clearTimeout(toastT);
    toastT = setTimeout(function () { t.className = 'hide'; }, 3400);
  }

  function render() {
    renderMeta();
    var v = el('view');
    try {
      if (app.tab === 'ssq') v.innerHTML = recView('ssq');
      else if (app.tab === 'dlt') v.innerHTML = recView('dlt');
      else if (app.tab === 'replay') v.innerHTML = replayView();
      else if (app.tab === 'quant') v.innerHTML = quantView();
      else v.innerHTML = helpView();
    } catch (e) {
      v.innerHTML = '<div class="card"><h2>渲染异常</h2><p class="note">' + esc(e && e.message || e) + '</p></div>';
    }
  }
  function bind() {
    var tabs = document.querySelectorAll('#tabs button');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener('click', function (ev) {
        var t = ev.currentTarget.getAttribute('data-tab');
        app.tab = t;
        for (var j = 0; j < tabs.length; j++) tabs[j].className = tabs[j].getAttribute('data-tab') === t ? 'on' : '';
        render();
        window.scrollTo(0, 0);
      });
    }
    document.addEventListener('click', function (ev) {
      var b = ev.target && ev.target.closest ? ev.target.closest('[data-sub]') : null;
      if (b) { app.sub = b.getAttribute('data-sub'); render(); }
      var w = ev.target && ev.target.closest ? ev.target.closest('[data-rw]') : null;
      if (w) {
        var nw = Number(w.getAttribute('data-rw'));
        if (nw !== app.rw) {
          var oldSlow = app.rw < 50 && nw >= 50;
          app.rw = nw;
          render();
          if (oldSlow) toast('已扩展复盘窗口至 ' + nw + ' 期（首次计算约需数秒到数十秒，之后有缓存）');
        }
      }
    });
    el('btnRefresh').addEventListener('click', function () { toast('正在检查更新…'); refresh(false); });
  }

  function boot() {
    initBaked();
    bind();
    render();
    app.booted = true;
    refresh(true);
  }
  boot();

  /* 供自动化测试/用户调试 */
  window.__APP__ = { app: app, refresh: refresh, render: render, SQ: SQ, DL: DL, aggStats: aggStats };
})();
