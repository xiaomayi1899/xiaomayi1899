name: 每日开奖数据更新
on:
  schedule:
    - cron: "35 13 * * *"   # 北京时间 21:35（双色球 21:15 开奖后）
    - cron: "5 14 * * *"    # 北京时间 22:05（大乐透 21:25 开奖后兜底）
    - cron: "30 1 * * *"    # 北京时间 09:30 晨间补漏
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lottery-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 拉取并更新开奖数据
        run: python scripts/fetch_update.py --out data
      - name: 提交并推送
        run: |
          git config user.name "lottery-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "开奖数据自动更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
